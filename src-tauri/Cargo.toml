[package]
name = "muffin-tidy-app"
version = "0.2.2"
description = "Muffin Tidy - 媒体文件整理工具"
authors = ["Mufeng"]
edition = "2021"

[lib]
name = "muffin_tidy_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.0", features = [] }

[dependencies]
tauri = { version = "2.12.0", features = ["protocol-asset"] }
tauri-plugin-opener = "2.6.0"
tauri-plugin-dialog = "2.8.0"
tauri-plugin-fs = "2.6.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
anyhow = "1.0.104"
walkdir = "2.5.0"
chrono = { version = "0.4.45", features = ["serde"] }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp", "gif", "tiff", "bmp", "ico"] }
jpeg-decoder = "0.3.2"
rayon = "1.12.0"
sha2 = "0.11.0"
hex = "0.4.3"
nom-exif = "3.8.0"
dunce = "1.0.5"
once_cell = "1.21.4"
urlencoding = "2.1.3"
base64 = "0.23.1"
filetime = "0.2.29"

# Windows: WIC for HEIC / RAW decoding, Shell thumbnail for video first-frame
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Graphics_Imaging",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_Storage_FileSystem",
    "Win32_Foundation",
    "Win32_UI_Shell",
] }
